<div class="portfolio-card">

    <div class="portfolio-header">
        <div>
            <h2>💼 Portfolio</h2>
            <span>Portfolio Overview</span>
        </div>

        <span class="portfolio-status">LIVE</span>
    </div>

    <div class="portfolio-summary">

        <div class="portfolio-stat">
            <span>Total Value</span>
            <strong id="portfolioValue">₹ 0.00</strong>
        </div>

        <div class="portfolio-stat">
            <span>Invested</span>
            <strong id="portfolioInvested">₹ 0.00</strong>
        </div>

        <div class="portfolio-stat">
            <span>Available Cash</span>
            <strong id="portfolioCash">₹ 0.00</strong>
        </div>

        <div class="portfolio-stat">
            <span>Total P&L</span>
            <strong id="portfolioPnL">₹ 0.00</strong>
        </div>

    </div>


    <div class="portfolio-section">

        <h3>Positions</h3>

        <div class="portfolio-table-wrapper">

            <table class="portfolio-table">

                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Qty</th>
                        <th>Entry</th>
                        <th>Current</th>
                        <th>P&L</th>
                    </tr>
                </thead>

                <tbody id="portfolioPositions">

                    <tr>
                        <td colspan="5">
                            No positions yet
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="risk-section">

        <h3>⚠️ Risk Overview</h3>

        <div class="risk-grid">

            <div class="risk-card">
                <span>Portfolio Risk</span>
                <strong id="portfolioRisk">0%</strong>
            </div>

            <div class="risk-card">
                <span>Max Drawdown</span>
                <strong id="maxDrawdown">0%</strong>
            </div>

            <div class="risk-card">
                <span>Risk / Reward</span>
                <strong id="portfolioRiskReward">--</strong>
            </div>

            <div class="risk-card">
                <span>Open Positions</span>
                <strong id="openPositions">0</strong>
            </div>

        </div>

    </div>

</div>
