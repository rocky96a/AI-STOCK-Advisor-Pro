<div class="trade-setup-card">

    <div class="card-header">
        <h3>🎯 Trade Setup</h3>
    </div>

    <div class="trade-signal">
        <span class="label">Signal</span>
        <strong id="tradeSignal">--</strong>
    </div>

    <div class="trade-grid">

        <!-- Entry -->
        <div class="trade-item">
            <span class="trade-label">Entry</span>
            <strong id="entryPrice">--</strong>
        </div>

        <!-- Stop Loss -->
        <div class="trade-item">
            <span class="trade-label">Stop Loss</span>
            <strong id="stopLoss">--</strong>
        </div>

        <!-- Target 1 -->
        <div class="trade-item">
            <span class="trade-label">Target 1</span>
            <strong id="targetPrice">--</strong>
        </div>

        <!-- Target 2 -->
        <div class="trade-item">
            <span class="trade-label">Target 2</span>
            <strong id="targetPrice2">--</strong>
        </div>

        <!-- Risk Reward -->
        <div class="trade-item">
            <span class="trade-label">Risk / Reward</span>
            <strong id="riskReward">--</strong>
        </div>

    </div>

</div>
