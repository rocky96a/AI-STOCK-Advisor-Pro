<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Stock Advisor{% endblock %}</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/ai.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chart.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/agents.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/news.css') }}">
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/watchlist.css') }}"
>
     <link rel="stylesheet" href="/static/css/ml.css">
<link rel="stylesheet" href="/static/css/strategy.css">
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/portfolio.css') }}"
>

</head>

<body class="{% block body_class %}{% endblock %}">

<!--
    All scripts below use `defer`: the browser can now parse and paint
    the HTML immediately instead of pausing at each <script> tag to
    download and run three separate charting libraries before the page
    is even visible. `defer` still guarantees these run in the order
    written, before DOMContentLoaded, so auth-guard.js still gets first
    say before any other script touches the API.
-->

<!-- Auth guard must run before anything else touches the API. -->
<script defer src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>

{% include 'components/sidebar.html' %}

<div class="main-content">

    {% include 'components/market_bar.html' %}

    {% include 'components/header.html' %}

    {% block content %}
    {% endblock %}

    {% include 'components/footer.html' %}

</div>

<!-- TradingView Lightweight Charts -->
<script defer src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<!-- ApexCharts -->
<script defer src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<!-- Chart.js -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% if request.path == '/ai-chat' %}
<script defer src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% else %}
<script defer src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/api_cache.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/chart.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/ml.js') }}"></script>
<script defer
    src="{{ url_for('static', filename='js/portfolio.js') }}">
</script>
<script defer src="{{ url_for('static', filename='js/watchlist.js') }}">
</script>
<script defer
    src="{{ url_for('static', filename='js/top_picks.js') }}">
</script>
{% endif %}

</body>

</html>
